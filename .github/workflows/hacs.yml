name: Home Assistant integration

on:
  push:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "frontend/**"
      - "docker-compose.yml"
      - "tests/frontend/home-assistant-proxy.test.js"
      - "tests/home_assistant/**"
      - ".github/workflows/hacs.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "frontend/**"
      - "docker-compose.yml"
      - "tests/frontend/home-assistant-proxy.test.js"
      - "tests/home_assistant/**"
      - ".github/workflows/hacs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install homeassistant==2024.12.5 pytest==8.3.4 pytest-asyncio==0.24.0
      - run: python -m pytest tests/home_assistant -q -o asyncio_default_fixture_loop_scope=function
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test ../tests/frontend/home-assistant-proxy.test.js
      - run: npm run build
