services:
  api:
    mem_limit: 4g
    memswap_limit: 4g
    build:
      context: ./backend
      args:
        INSTALL_GAT: "1"
    environment:
      MULTISTATE_FIXTURE_DIR: /app/fixtures
      STATIC_HISTORY_DIR: /app/data/static_history
      REAL_HISTORY_PATH: /app/data/datosreales/history.csv
      VALIDATION_HISTORY_PATH: /app/data/datosreales/historico_validacion.csv
      ANALYSIS_CACHE_PATH: /app/data/cache/real_history_analysis.json
      CONTINUOUS_CONF_PATH: /app/data/cache/conf.txt
      CONTEXT_MAP_CACHE_PATH: /app/data/cache/contextual_map.json
      REVIEW_DATA_DIR: /app/data/review
      HISTORICAL_DATA_DIR: /app/HistoricoPuro
      FLOW_LAB_DB_PATH: /app/data/cache/flow_lab.sqlite3
      VALIDATION_REPLAY_MEMORY_RESULTS: "500"
      VALIDATION_REPLAY_STATUS_RESULTS: "25"
      CONTEXT_CONTINUOUS_MAX_AGE_SECONDS: "3600"
      CONTEXT_CONTINUOUS_MAX_AGE_BY_ENTITY: "{}"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data/fixtures:/app/fixtures:ro
      - ./data/static_history:/app/data/static_history
      - ./data/datosreales:/app/data/datosreales
      - ./data/cache:/app/data/cache
      - ./data/review:/app/data/review
      - ../HistoricoPuro:/app/HistoricoPuro:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
